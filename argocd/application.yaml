apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-campus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CallMeSep/projet_iot.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: smart-campus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
