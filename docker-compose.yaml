# Plateforme Smart Campus - étape actuelle : broker + un conteneur par compteur.
# Les données sont générées dans l'image : rien à préparer sur la machine,
# sauf mosquitto/mosquitto.conf.
#
#   docker compose up --build                                  # démarrage simple
#   DEPART=$(( $(date +%s) + 10 )) docker compose up --build   # compteurs synchronisés
#   PAUSE=0.1 docker compose up                                # rejeu rapide

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"       # utile pour tester depuis la machine hôte ; à retirer ensuite
    networks:
      - batiment-a
      - batiment-b
      - acquisition

  compteur-01:
    build: ./Generateur_donnees
    depends_on:
      - mosquitto
    environment:
      COMPTEUR: compteur-01
      MQTT_HOST: mosquitto
      PAUSE: 5       # secondes réelles entre deux pas de 5 minutes
      DEPART: ${DEPART:-}       # instant de départ commun (secondes Unix), vide = immédiat
    networks:
      - batiment-a
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  compteur-02:
    build: ./Generateur_donnees
    depends_on:
      - mosquitto
    environment:
      COMPTEUR: compteur-02
      MQTT_HOST: mosquitto
      PAUSE: 5       # secondes réelles entre deux pas de 5 minutes
      DEPART: ${DEPART:-}       # instant de départ commun (secondes Unix), vide = immédiat
    networks:
      - batiment-a
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
  compteur-03:
    build: ./Generateur_donnees
    depends_on:
      - mosquitto
    environment:
      COMPTEUR: compteur-03
      MQTT_HOST: mosquitto
      PAUSE: 5       # secondes réelles entre deux pas de 5 minutes
      DEPART: ${DEPART:-}       # instant de départ commun (secondes Unix), vide = immédiat
    networks:
      - batiment-b
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  compteur-04:
    build: ./Generateur_donnees
    depends_on:
      - mosquitto
    environment:
      COMPTEUR: compteur-04
      MQTT_HOST: mosquitto
      PAUSE: 5       # secondes réelles entre deux pas de 5 minutes
      DEPART: ${DEPART:-}       # instant de départ commun (secondes Unix), vide = immédiat
    networks:
      - batiment-b
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M


  nodered:
    image: nodered/node-red:4.0.5
    ports:
      - "1880:1880"            # interface web, pendant le développement
    volumes:
      - ./nodered:/data        # flux et réglages versionnés dans le dépôt
    depends_on:
      - mosquitto
    networks:
      - acquisition

networks:
  batiment-a:
  batiment-b:
  acquisition: